<h4 class="mb-3">Apis por Rol</h4>

<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <h6 class="mb-3">Crear nuevo rol</h6>
    <div class="input-group" style="max-width: 420px;">
      <input class="form-control" [(ngModel)]="nuevoRol" placeholder="nombre del rol (ej: supervisor)" />
      <button class="btn btn-outline-primary" (click)="crearRol()">Crear rol</button>
    </div>
  </div>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-5">
        <label class="form-label small">Rol a editar</label>
        <select class="form-select" [ngModel]="rolSeleccionado" (ngModelChange)="seleccionarRol($event)">
          <option value="" disabled selected>Seleccione un rol</option>
          <option *ngFor="let p of permisos" [value]="p.rol">{{ p.rol }}</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-success w-100" (click)="guardar()">Guardar paths</button>
      </div>
    </div>

    <div *ngIf="rolSeleccionado" class="table-responsive">
      <table class="table tabla-oscura">
        <thead>
          <tr>
            <th style="width: 60px;"></th>
            <th>Path</th>
            <th>Metodo</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of catalogo">
            <td>
              <input type="checkbox" class="form-check-input" [checked]="estaMarcado(p)" (change)="toggle(p)" />
            </td>
            <td>{{ p.path }}</td>
            <td>{{ p.metodo }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="text-muted" *ngIf="!rolSeleccionado">Seleccione un rol para ver y editar sus paths permitidos.</p>
  </div>
</div>
